spring:
  application:
    name: library_api

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/library
    username: postgres
    password: postgres
  jpa:
    hibernate:
      #      ddl-auto: update
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

server:
  port: 3000

logging:
  level:
    org:
      hibernate:
        type: trace
        sql: debug
